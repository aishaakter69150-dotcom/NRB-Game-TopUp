<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BS TOPUP - Fastest Topup Center</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Hind Siliguri,sans-serif}
body{background:#f2f2f2;padding-bottom:90px}
.top{background:#fff;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.logo{font-size:28px;font-weight:900;line-height:1}
.logo b{color:#0a3d5c}
.logo span{color:#b1005a}
.logo small{font-size:8px;letter-spacing:2px;display:block;color:#333}
.login-btn{background:#0a3d5c;color:#fff;border:none;padding:10px 22px;border-radius:6px;font-weight:bold;font-size:18px}
.card{background:#fff;margin:12px;border-radius:12px;padding:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
