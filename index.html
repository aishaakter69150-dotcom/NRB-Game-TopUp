<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BS TOPUP - Fastest Topup Center</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Hind Siliguri,sans-serif}
body{background:#f2f2f2;padding-bottom:120px}
.top{background:#7a0000;color:white;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
.logo{font-size:28px;font-weight:900;line-height:1}
.logo b{color:#7a2fd0}
.logo span{color:white}
.logo small{font-size:8px;letter-spacing:2px;color:white;display:block}
.balance{background:#7a0000;color:white;border:1px solid #a33;padding:8px 14px;border-radius:30px;font-weight:bold;display:flex;gap:6px;align-items:center}
.avatar{background:#8e24aa;color:white;width:45px;height:45px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid white}
.card{background:white;margin:12px;border-radius:12px;padding:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1px solid #ddd;border-radius:8px;padding:12px 8px;display:flex;align-items:center;gap:7px;cursor:pointer;background:white;min-height:58px}
.opt.active{border:2px solid #ff7a00;background:#fff8f0}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid #ccc;background:#e8e8e8;flex-shrink:0}
.opt.active .dot{background:#ff7a00;border-color:#ff7a00}
.opt b{font-size:14px;line-height:1.2}
.opt span{color:#ff7a00;font-weight:900;font-size:14px;margin-left:auto;white-space:nowrap;text-align:right}
.how{color:#e67e00;font-weight:bold;font-size:16px;margin:10px 0;display:flex;gap:6px;align-items:center}
input{width:100%;padding:12px;border:1px solid #7a0000;border-radius:8px;font-size:16px;outline:none;margin-top:8px}
